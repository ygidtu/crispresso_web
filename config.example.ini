# CRISPResso2 分析平台 —— Web 服务配置模板
# 复制为 config.ini 后按需修改；config.ini 已被 .gitignore 排除（含密码/IP，勿入库）
# 修改后需重启服务生效（./run.sh 或 uv run python app.py）

[server]
# 监听地址与端口
host = 0.0.0.0
port = 5000

[security]
# 允许访问的 IP / 网段（逗号分隔）。
# 单个 IP 直接写；网段写 x.x.x.0 会自动按 /24 处理（也可显式写 x.x.x.0/24）。
# 本机回环地址 127.0.0.0/8 与 ::1 始终放行，便于服务器本机运维。
allowed_ips = 10.0.0.1, 10.0.1.0

[oss]
# OSS 下载相关
# ossutil 可执行文件路径（默认取 PATH 中的 ossutil）
ossutil_bin = ossutil

[data]
# 数据根目录：raw_root 下拉选项 = 此目录下的子文件夹（每个子文件夹 = 一次交付/一个 run）
runs_root = /mnt/nas1/数据备份/your_dataset/

[mail]
# 任务/下载完成邮件通知（SMTP；QQ/Foxmail 邮箱用 smtp.qq.com 465 + 授权码）
# enabled=false 可整体关闭；to 支持逗号分隔多个收件人
enabled = true
host = smtp.qq.com
port = 465
user = your_email@example.com
password = your_smtp_auth_code
to = your_email@example.com
